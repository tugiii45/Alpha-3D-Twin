<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const K = (() => {
// All dimensions are metres. The street runs along +z, the facade plane is z = 0, the tower extends toward -z.
const FLOOR_H = 3.6;
const GLASS_W = 1.5;
const GLASS_H = 1.95;
const WIN_W = 1.2;
const WIN_H = 1.5;
const WIN_PITCH = 1.8;
const BATTEN_PITCH = 0.42;
const FENCE_Z = 12.5;
const TOWER_TOP = 58;
const PAPER = 0xf6f2e9;

const VIEWS = {
  sketch: { pos: [-8, 1.7, 44], target: [3, 42, 0] },
};

// Fly-by control points; converted to chained cubic Bezier segments in the engine.
const FLY = {
  duration: 30,
  pos: [
    [6, 2.2, 26], [2, 5, 17], [-6, 12, 15], [-11, 22, 12], [-12, 34, 9],
    [-4, 46, 9], [10, 56, 12], [20, 70, 18], [16, 84, 20],
  ],
  target: [
    [6, 5, 4], [4, 9, 2], [0, 16, 2], [-2, 24, 2], [-2, 34, 0],
    [0, 46, 0], [0, 56, -1], [-2, 60, -0.6], [-2, 60, -0.6],
  ],
};

const BOUNDS = { min: [-95, 0.8, -75], max: [95, 125, 95] };

// Axis-aligned collision volumes the explore camera is pushed out of.
const COLLIDERS = [
  { min: [-20.3, 0, -31], max: [20.3, 63.5, -0.05] },
  { min: [-7.4, 9, -0.05], max: [3.5, 41.5, 3.4] },
  { min: [-19.9, 0, FENCE_Z - 0.15], max: [-8.4, 3.2, FENCE_Z + 0.15] },
  { min: [-3.3, 0, FENCE_Z - 0.15], max: [11.1, 3.2, FENCE_Z + 0.15] },
  { min: [11.5, 0, FENCE_Z - 0.15], max: [19.4, 3.2, FENCE_Z + 0.15] },
];

const f2 = (n) => n.toFixed(2);
const BANDS = [
  {
    from: 0, to: 9.2, name: 'Podium and porte-cochère', color: '#6a4a34',
    notes: ['Timber batten soffit', `${f2(BATTEN_PITCH)} m batten pitch`, 'Dark steel fascia'],
  },
  {
    from: 9.2, to: 28.6, name: 'Blue curtain wall', color: '#8fb1d6',
    notes: ['Glazing module', `${f2(GLASS_W)} × ${f2(GLASS_H)} m`, '4 modules per 6 m bay'],
  },
  {
    from: 28.6, to: 58, name: 'Sandstone guestroom grid', color: '#c6996a',
    notes: ['Punched window', `${f2(WIN_W)} × ${f2(WIN_H)} m`, `${f2(WIN_PITCH)} m pitch, ${f2(FLOOR_H)} m floors`],
  },
  {
    from: 58, to: 64, name: 'Crown', color: '#4a4c55',
    notes: ['Recessed plant level', 'Rooftop HYATT sign'],
  },
];
const bandAt = (h) => BANDS.find((b) => h >= b.from && h < b.to) || BANDS[BANDS.length - 1];

return {FLOOR_H,GLASS_W,GLASS_H,WIN_W,WIN_H,WIN_PITCH,BATTEN_PITCH,FENCE_Z,TOWER_TOP,PAPER,VIEWS,FLY,BOUNDS,COLLIDERS,BANDS,bandAt};
})();
const T = (() => {


function rng(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}
function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return [c, c.getContext('2d')];
}
function tex(c, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/** 4 m tile, 1 m panel joints. */
function sandstone() {
  const [c, g] = cv(512, 512);
  const r = rng(11);
  g.fillStyle = '#c6996a';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = r() > 0.5 ? `rgba(255,235,200,${r() * 0.12})` : `rgba(90,55,25,${r() * 0.14})`;
    g.fillRect(r() * 512, r() * 512, 1 + r() * 2.5, 1 + r() * 2.5);
  }
  g.strokeStyle = 'rgba(88,56,30,.4)';
  g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(0, i * 128); g.lineTo(512, i * 128); g.stroke();
    g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, 512); g.stroke();
  }
  return tex(c);
}

/** 4 m tile. Plain planks (0.25 m) or the wavy contour-grain band above the entrance. */
function timber(wavy) {
  const [c, g] = cv(512, 512);
  const r = rng(wavy ? 5 : 7);
  g.fillStyle = wavy ? '#5b3f2d' : '#4a3022';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = `rgba(${r() > 0.5 ? '255,220,170' : '20,10,5'},${0.04 + r() * 0.1})`;
    g.lineWidth = 1 + r() * 2;
    const y = r() * 512;
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(150, y + r() * 10 - 5, 350, y + r() * 10 - 5, 512, y + r() * 8 - 4);
    g.stroke();
  }
  if (wavy) {
    g.strokeStyle = '#1d110a';
    for (let i = 0; i < 12; i++) {
      const y = i * 44 + 10;
      g.lineWidth = 2 + r() * 2.5;
      g.beginPath();
      g.moveTo(0, y);
      g.bezierCurveTo(128, y - 30 + r() * 40, 256, y + 30 - r() * 40, 384, y - 10 + r() * 20);
      g.bezierCurveTo(440, y - 20, 480, y + 10, 512, y);
      g.stroke();
    }
  } else {
    g.strokeStyle = 'rgba(15,8,3,.7)';
    g.lineWidth = 2;
    for (let y = 0; y <= 512; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  }
  return tex(c);
}

/** One tile = 4 x 2 glazing modules = 6 m x 3.9 m (modules 1.5 x 1.95 m). */
function glass() {
  const [c, g] = cv(384, 250);
  const r = rng(23);
  for (let j = 0; j < 2; j++) {
    for (let i = 0; i < 4; i++) {
      const x = i * 96, y = j * 125, t = r();
      const gr = g.createLinearGradient(x, y, x, y + 125);
      gr.addColorStop(0, `hsl(${208 + t * 8},${55 + t * 15}%,${68 + r() * 8}%)`);
      gr.addColorStop(1, `hsl(${205 + t * 6},45%,${80 + r() * 8}%)`);
      g.fillStyle = gr;
      g.fillRect(x, y, 96, 125);
      if (r() > 0.55) {
        g.fillStyle = 'rgba(255,255,255,.55)';
        g.beginPath();
        g.ellipse(x + 20 + r() * 50, y + 30 + r() * 60, 22 + r() * 20, 9 + r() * 8, 0, 0, 7);
        g.fill();
      }
    }
  }
  // small operable lights
  [[1, 0], [3, 1], [2, 1]].forEach(([i, j]) => {
    const x = i * 96 + 34, y = j * 125 + 84;
    g.fillStyle = '#ecf2f6'; g.fillRect(x, y, 30, 20);
    g.strokeStyle = '#2b3a4c'; g.lineWidth = 2; g.strokeRect(x, y, 30, 20);
  });
  g.strokeStyle = '#1b2736';
  g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 96, 0); g.lineTo(i * 96, 250); g.stroke(); }
  for (let j = 0; j <= 2; j++) { g.beginPath(); g.moveTo(0, j * 125); g.lineTo(384, j * 125); g.stroke(); }
  return tex(c);
}

/** Grey stone cladding for gateposts and plinth, 2 m tile. */
function stone() {
  const [c, g] = cv(256, 256);
  const r = rng(31);
  g.fillStyle = '#a39b90';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3500; i++) {
    g.fillStyle = `rgba(${r() > 0.5 ? '255,255,255' : '40,35,30'},${r() * 0.12})`;
    g.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1 + r() * 2);
  }
  g.strokeStyle = 'rgba(50,45,40,.45)';
  g.lineWidth = 2;
  for (let y = 0; y <= 256; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); }
  return tex(c);
}

function logo(g, x, y, s) {
  g.save();
  g.translate(x, y);
  g.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i + Math.PI / 6;
    g.lineTo(Math.cos(a) * s, Math.sin(a) * s);
  }
  g.closePath();
  g.fillStyle = '#6b4488'; g.fill();
  g.strokeStyle = '#d9c7e6'; g.lineWidth = s * 0.09; g.stroke();
  g.beginPath();
  g.moveTo(-s * 0.45, 0); g.lineTo(0, -s * 0.45); g.lineTo(s * 0.45, 0); g.lineTo(0, s * 0.45);
  g.closePath(); g.stroke();
  g.restore();
}

/** Signage canvases: 'regency' fascia, 'roof' rooftop sign, 'totem' monolith face, 'noentry' disc. */
function sign(kind) {
  const [w, h] = { regency: [1024, 112], roof: [512, 128], totem: [256, 512], noentry: [256, 256] }[kind];
  const [c, g] = cv(w, h);
  const font = (wt, px) => `${wt} ${px}px "Gill Sans","Gill Sans MT","Trebuchet MS",Calibri,sans-serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  if (kind === 'regency') {
    g.fillStyle = '#2a2b32'; g.fillRect(0, 0, w, h);
    logo(g, 70, 56, 40);
    g.font = font(600, 60); g.letterSpacing = '8px'; g.fillStyle = '#ecebe8';
    g.fillText('HYATT REGENCY', 560, 58);
  } else if (kind === 'roof') {
    g.fillStyle = '#25272d'; g.fillRect(0, 0, w, h);
    g.font = font(700, 84); g.letterSpacing = '14px'; g.fillStyle = '#f1efe9';
    g.fillText('HYATT', w / 2 + 6, h / 2 + 4);
  } else if (kind === 'totem') {
    g.fillStyle = '#f3efe7'; g.fillRect(0, 0, w, h);
    logo(g, 128, 112, 46);
    g.fillStyle = '#2a2a30';
    g.font = font(700, 54); g.letterSpacing = '4px'; g.fillText('HYATT', 128, 250);
    g.font = font(400, 38); g.fillText('REGENCY', 128, 308);
    g.fillRect(80, 400, 96, 8);
  } else {
    g.fillStyle = '#d8392b';
    g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill();
    g.strokeStyle = '#f3d2c8'; g.lineWidth = 8;
    g.beginPath(); g.arc(128, 128, 112, 0, 7); g.stroke();
    g.fillStyle = '#fff3ee'; g.font = font(700, 62);
    g.fillText('NO', 128, 98); g.fillText('ENTRY', 128, 164);
  }
  return tex(c, false);
}

return {sandstone,timber,glass,stone,sign};
})();
const {buildHotel} = (() => {




const dummy = new THREE.Object3D();
const std = (o) => new THREE.MeshStandardMaterial(o);

/** Box whose UVs are scaled to world units so textures tile at tw x th metres on every face. */
function texBox(w, h, d, tw, th = tw) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) {
    for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      uv.setXY(i, (uv.getX(i) * dims[f][0]) / tw, (uv.getY(i) * dims[f][1]) / th);
    }
  }
  return g;
}

/** InstancedMesh from [{p, s, r}] items. */
function inst(geo, mat, items, { cast = true, receive = true } = {}) {
  const m = new THREE.InstancedMesh(geo, mat, items.length);
  items.forEach((it, i) => {
    dummy.position.set(...it.p);
    dummy.rotation.set(...(it.r || [0, 0, 0]));
    dummy.scale.set(...(it.s || [1, 1, 1]));
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
  });
  m.instanceMatrix.needsUpdate = true;
  m.castShadow = cast;
  m.receiveShadow = receive;
  m.frustumCulled = false;
  return m;
}

function buildHotel() {
  const root = new THREE.Group();
  root.name = 'hotel';
  const glassTex = T.glass();
  const signRegency = T.sign('regency');
  const signRoof = T.sign('roof');
  const signTotem = T.sign('totem');

  const M = {
    sand: std({ map: T.sandstone(), roughness: 0.92 }),
    timber: std({ map: T.timber(false), roughness: 0.7 }),
    wave: std({ map: T.timber(true), roughness: 0.6 }),
    glass: std({ map: glassTex, emissiveMap: glassTex, emissive: 0xffffff, emissiveIntensity: 0.22, roughness: 0.12, metalness: 0.3 }),
    lobby: std({ color: 0x8fb4d4, roughness: 0.1, metalness: 0.4 }),
    steel: std({ color: 0x2b2c31, roughness: 0.5, metalness: 0.6 }),
    dark: std({ color: 0x1e1f24, roughness: 0.6, metalness: 0.4 }),
    white: std({ color: 0xf1eee8, roughness: 0.55 }),
    stone: std({ map: T.stone(), roughness: 0.95 }),
    win: std({ color: 0x35516f, roughness: 0.15, metalness: 0.5 }),
    ledge: std({ color: 0x6a4a34, roughness: 0.7 }),
    canopy: std({ color: 0xa8cfe8, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.38, depthWrite: false }),
    warm: new THREE.MeshBasicMaterial({ color: 0xffd9a0 }),
    pave: std({ color: 0xd8d3c7, roughness: 1 }),
    road: std({ color: 0x9d9b97, roughness: 1 }),
    neighbor: std({ color: 0xcfd3d8, roughness: 0.85 }),
    tan: std({ color: 0xc9b496, roughness: 0.9 }),
    red: std({ color: 0x9c2b25, roughness: 0.6 }),
    person: std({ color: 0x2f3036, roughness: 1 }),
    fadeLine: new THREE.LineBasicMaterial({ color: 0x1b1b22, transparent: true, opacity: 0.5 }),
    wire: new THREE.LineBasicMaterial({ color: 0x1b1b22 }),
  };

  const add = (geo, mat, x, y, z, { cast = true, receive = true, r } = {}) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (r) m.rotation.set(...r);
    m.castShadow = cast;
    m.receiveShadow = receive;
    root.add(m);
    return m;
  };
  /** Facade slab: x0..x1, y0..y1, front face at z0, thickness d behind it. */
  const P = (mat, x0, x1, y0, y1, z0, d, tw = 4, th = tw) =>
    add(texBox(x1 - x0, y1 - y0, d, tw, th), mat, (x0 + x1) / 2, (y0 + y1) / 2, z0 - d / 2);
  const glassP = (x0, x1, y0, y1, z0, d) => P(M.glass, x0, x1, y0, y1, z0, d, 6, 3.9);

  /* ---------- tower mass and podium ---------- */
  P(M.sand, -20, 20, 0, K.TOWER_TOP, -1, 29);
  P(M.stone, -20, 20, 0, 0.8, 0.3, 0.6, 2);
  P(M.timber, -20, 0, 0, 9.2, 0, 1);
  P(M.timber, 0, 20, 0, 9.2, 0, 1);
  P(M.lobby, -18, -2, 1.2, 6.5, 0.12, 0.2);
  P(M.lobby, 2, 17, 0.8, 5.8, 0.12, 0.2);
  P(M.wave, 0, 20, 9.2, 13, 0.4, 1.4);

  /* ---------- glass curtain walls ---------- */
  P(M.sand, -20, -7, 9.2, 20.9, 0, 1);
  glassP(-19.5, -7.5, 9.2, 20.9, 0.25, 0.4); // 8 x 6 modules
  P(M.sand, 3, 20, 13, 28.6, 0, 1);
  glassP(4, 19, 13, 28.6, 0.25, 0.4); // 10 x 8 modules

  const mullionV = [], mullionH = [];
